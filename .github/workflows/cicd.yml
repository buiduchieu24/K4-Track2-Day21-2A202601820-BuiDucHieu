name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "setuptools<70"

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt "dvc[s3]" boto3
          pip install "setuptools<70"

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python -c '
          import json, os, sys
          raw = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          if not raw:
              print("ERROR: STORAGE_CREDENTIALS secret is empty!")
              sys.exit(1)
          try:
              creds = json.loads(raw)
          except Exception as e:
              print("ERROR: Failed to parse STORAGE_CREDENTIALS as JSON:", e)
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              if isinstance(creds, dict) and ("aws_access_key_id" in creds or "AWS_ACCESS_KEY_ID" in creds):
                  ak = creds.get("aws_access_key_id") or creds.get("AWS_ACCESS_KEY_ID")
                  sk = creds.get("aws_secret_access_key") or creds.get("AWS_SECRET_ACCESS_KEY")
                  f.write(f"AWS_ACCESS_KEY_ID={ak}\n")
                  f.write(f"AWS_SECRET_ACCESS_KEY={sk}\n")
                  f.write("AWS_DEFAULT_REGION=us-east-1\n")
                  print("Configured AWS credentials successfully.")
              else:
                  with open("/tmp/sa-key.json", "w") as kf:
                      json.dump(creds, kf)
                  f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
                  print("Configured GCP credentials successfully.")
          '

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # TODO 5: Su dung cloud SDK de upload models/model.joblib len
        #         <bucket>/artifacts/current/model.joblib.
        run: |
          python - <<'PYEOF'
          import os
          bucket = "${{ secrets.ARTIFACT_BUCKET }}"
          key = "artifacts/current/model.joblib"
          local_path = "models/model.joblib"
          try:
              import boto3
              s3 = boto3.client("s3")
              s3.upload_file(local_path, bucket, key)
              print(f"Uploaded {local_path} to s3://{bucket}/{key}")
          except Exception as e:
              print(f"AWS upload notice: {e}")
              from google.cloud import storage
              client = storage.Client()
              b = client.bucket(bucket)
              blob = b.blob(key)
              blob.upload_from_filename(local_path)
              print(f"Uploaded {local_path} to gs://{bucket}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
